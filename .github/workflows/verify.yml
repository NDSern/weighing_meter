name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 matches production; 3.12 is the development interpreter.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Runtime deps needed by unit tests. Tests stub cv2/minio/serial and the
      # RKNN runtime, so those heavy wheels are intentionally not installed.
      - run: python -m pip install numpy paho-mqtt ruff
      - run: make verify